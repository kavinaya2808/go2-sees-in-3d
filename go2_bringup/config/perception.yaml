# Parameters for go2_perception/cluster_node. All distances in metres, in the LiDAR frame
# (velodyne: x forward, y left, z up; the sensor sits on the Go2's back).
cluster_node:
  ros__parameters:
    input_topic: /velodyne_points/points

    # Region of interest around the sensor
    roi_min: [-10.0, -10.0, -1.0]
    roi_max: [10.0, 10.0, 1.5]

    # The dog's own body and legs (removed so they don't become a cluster)
    self_min: [-0.6, -0.35, -1.0]
    self_max: [0.6, 0.35, 0.3]

    voxel_leaf: 0.08

    # RANSAC ground plane
    ground_distance: 0.08
    ground_max_angle_deg: 15.0
    ground_max_iterations: 100
    ground_min_inliers: 50

    # Euclidean clustering. VLP-16 rings are ~2 deg apart, so at 5 m neighbouring
    # rings are ~0.17 m apart; the tolerance must be larger than that.
    cluster_tolerance: 0.35
    min_cluster_size: 8
    max_cluster_size: 5000

    # Sanity filters on the resulting boxes
    min_cluster_height: 0.10
    max_cluster_extent: 4.0

# 2D detector on the D455 colour image (go2_detector/detector_node)
detector_node:
  ros__parameters:
    image_topic: /d455/image          # check with: ros2 topic list | grep d455
    output_topic: /perception/detections_2d
    backends: ["color", "yolo"]       # drop "yolo" to run colour-only
    max_rate_hz: 5.0
    min_area: 150                     # colour blobs smaller than this (px) are ignored
    yolo_model: yolo11n.pt            # downloaded automatically on first run
    yolo_conf: 0.4
    yolo_device: cpu
    yolo_classes: ["person"]          # COCO classes to keep, e.g. ["person", "car"]

# LiDAR-camera fusion (go2_fusion/fusion_node)
fusion_node:
  ros__parameters:
    clusters_topic: /perception/clusters
    detections_topic: /perception/detections_2d
    camera_info_topic: /d455/camera_info
    image_topic: /d455/image          # only used for the debug image
    camera_frame: d455_camera_color_optical_frame   # optical frame: z forward, x right, y down
    min_iou: 0.15                     # projected cluster box vs detection box
    max_detection_age: 1.0            # seconds between LiDAR scan and camera frame
    min_depth: 0.3                    # ignore box corners closer than this to the camera
    fragment_containment: 0.6         # unmatched detection this much inside a same-class object = fragment
    lidar_confidence: 0.6             # confidence for a LiDAR-only object
    alert_classes: ["person"]
    alert_radius: 5.0                 # metres
